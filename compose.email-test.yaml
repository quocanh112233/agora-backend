# Isolated local SMTP inbox; do not use this override for real mail delivery.
services:
  network:
    ports:
      - 127.0.0.1:8025:8025
  mailpit:
    image: axllent/mailpit:v1.27.10
    network_mode: service:network
    environment:
      MP_SMTP_BIND_ADDR: 127.0.0.1:1025
      MP_UI_BIND_ADDR: 0.0.0.0:8025
      MP_MAX_MESSAGES: '100'
    depends_on:
      network: {condition: service_started}
    user: '10001:10001'
    read_only: true
    tmpfs: ['/tmp:rw,noexec,nosuid,size=32m']
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
  email:
    environment:
      SMTP_HOST: 127.0.0.1
      SMTP_PORT: '1025'
      SMTP_AUTH: 'false'
      SMTP_STARTTLS: 'false'
      SMTP_SSL: 'false'
      SMTP_USERNAME: ''
      SMTP_PASSWORD: ''
      SMTP_FROM: agora@example.test
      PUBLIC_WEB_ORIGIN: http://127.0.0.1:3000
  identity:
    environment:
      EMAIL_DELIVERY_ENABLED: 'true'
      # Fixture throughput only; production keeps the10attempt/15minute policy, tested separately.
      SPRING_APPLICATION_JSON: '{"agora":{"auth":{"rate-limit":{"attempts":1000}}}}'
