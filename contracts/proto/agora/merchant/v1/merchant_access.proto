syntax = "proto3";

package agora.merchant.v1;
option java_package = "com.agora.contracts.merchant.v1";
option java_multiple_files = true;

// Internal authenticated loopback transport. Seller resolution requires Identity authentication;
// the public projection returns only current ACTIVE shop IDs and names, never owner/contact/address.
service MerchantAccess {
  rpc ResolveActiveShop(ResolveActiveShopRequest) returns (ResolveActiveShopResponse);
  rpc FindPublicShops(FindPublicShopsRequest) returns (FindPublicShopsResponse);
}

message ResolveActiveShopRequest { string account_id = 1; }
message ResolveActiveShopResponse { string shop_id = 1; }

// One to five distinct canonical UUIDs. Missing/non-ACTIVE shops are omitted.
message FindPublicShopsRequest { repeated string shop_ids = 1; }
message PublicShop { string id = 1; string name = 2; }
message FindPublicShopsResponse { repeated PublicShop shops = 1; }
