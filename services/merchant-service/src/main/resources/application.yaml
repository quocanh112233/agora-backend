spring:
  application:
    name: merchant-service
  config:
    import: optional:file:./.env[.properties]
  datasource:
    url: jdbc:postgresql://${DB_HOST:127.0.0.1}:${DB_PORT:5432}/${MERCHANT_DB_NAME:agora_merchant}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
  flyway:
    default-schema: merchant
    schemas: merchant
    create-schemas: true
    locations: classpath:db/migration
  jackson:
    deserialization:
      fail-on-unknown-properties: true
      fail-on-trailing-tokens: true

server:
  address: ${MERCHANT_SERVER_ADDRESS:127.0.0.1}
  port: ${MERCHANT_SERVER_PORT:8082}

agora:
  identity:
    token: ${INTERSERVICE_TOKEN:}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
