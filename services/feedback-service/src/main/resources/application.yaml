spring:
  application:
    name: feedback-service
  config:
    import: optional:file:./.env[.properties]
  datasource:
    url: jdbc:postgresql://${DB_HOST:127.0.0.1}:${DB_PORT:5432}/${FEEDBACK_DB_NAME:agora_feedback}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 3000
  flyway:
    default-schema: feedback
    schemas: feedback
    create-schemas: true
    locations: classpath:db/migration
  jackson:
    deserialization:
      fail-on-unknown-properties: true
      fail-on-trailing-tokens: true
server:
  address: ${FEEDBACK_SERVER_ADDRESS:127.0.0.1}
  port: ${FEEDBACK_SERVER_PORT:8086}
agora:
  internal-token: ${INTERSERVICE_TOKEN:}
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
