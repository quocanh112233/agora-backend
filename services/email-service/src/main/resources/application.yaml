spring:
  application:
    name: email-service
  config:
    import: optional:file:./.env[.properties]
  datasource:
    url: jdbc:postgresql://${DB_HOST:127.0.0.1}:${DB_PORT:5432}/${EMAIL_DB_NAME:agora_email}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
  flyway:
    default-schema: email
    schemas: email
    create-schemas: true
  mail:
    default-encoding: UTF-8
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${SMTP_STARTTLS:true}
      mail.smtp.starttls.required: ${SMTP_STARTTLS:true}
      mail.smtp.ssl.enable: ${SMTP_SSL:false}
      mail.smtp.ssl.checkserveridentity: true
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
server:
  address: ${EMAIL_SERVER_ADDRESS:127.0.0.1}
  port: ${EMAIL_SERVER_PORT:8087}
  error:
    include-message: never
    include-stacktrace: never
agora:
  email:
    from: ${SMTP_FROM:}
    origin: ${PUBLIC_WEB_ORIGIN:http://127.0.0.1:3000}
  grpc:
    enabled: ${EMAIL_GRPC_ENABLED:false}
    port: ${EMAIL_GRPC_PORT:9095}
    token: ${INTERSERVICE_TOKEN:}
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
  health:
    mail:
      enabled: false
