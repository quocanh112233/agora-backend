spring:
  application:
    name: identity-service
  config:
    import: optional:file:./.env[.properties]
  datasource:
    url: jdbc:postgresql://${DB_HOST:127.0.0.1}:${DB_PORT:5432}/${DB_NAME:agora}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
  flyway:
    default-schema: identity
    schemas: identity
    create-schemas: true
    locations: classpath:db/migration
  session:
    timeout: 30m
    jdbc:
      initialize-schema: never
      table-name: identity.spring_session
  jackson:
    deserialization:
      fail-on-unknown-properties: true

server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:8081}
  servlet:
    session:
      cookie:
        name: AGORA_SESSION
        path: /
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}

agora:
  email:
    token-key: ${EMAIL_TOKEN_ENCRYPTION_KEY:}
    delivery-enabled: ${EMAIL_DELIVERY_ENABLED:false}
    host: ${EMAIL_GRPC_HOST:127.0.0.1}
    port: ${EMAIL_GRPC_PORT:9095}
  grpc:
    enabled: ${IDENTITY_GRPC_ENABLED:false}
    port: ${IDENTITY_GRPC_PORT:9091}
    token: ${INTERSERVICE_TOKEN:}
  auth:
    rate-limit:
      attempts: 10
      window: 15m
      max-keys: 10000

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
