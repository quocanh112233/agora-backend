spring:
  application:
    name: catalog-service
  config:
    import: optional:file:./.env[.properties]
  datasource:
    url: jdbc:postgresql://${DB_HOST:127.0.0.1}:${DB_PORT:5432}/${CATALOG_DB_NAME:agora_catalog}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
  flyway:
    default-schema: catalog
    schemas: catalog
    create-schemas: true
    locations: classpath:db/migration
  jackson:
    deserialization:
      fail-on-unknown-properties: true
      fail-on-trailing-tokens: true

server:
  address: ${CATALOG_SERVER_ADDRESS:127.0.0.1}
  port: ${CATALOG_SERVER_PORT:8083}

agora:
  internal-token: ${INTERSERVICE_TOKEN:}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
