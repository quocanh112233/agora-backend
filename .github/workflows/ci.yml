name: Backend CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Verify every module with disposable PostgreSQL
        run: ./mvnw -B -ntp -Dagora.test.postgres-image=postgres:16 verify
      - name: Build all service images without publishing
        run: |
          for service in identity merchant catalog commerce payment feedback; do
            docker build --build-arg SERVICE="$service-service" --tag "agora/$service:ci" .
          done
